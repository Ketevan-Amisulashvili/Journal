<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Moderate discussions</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Noto+Serif+Georgian:wght@300..700&family=Noto+Sans+Georgian:wght@400..600&family=Instrument+Sans:wght@400..600&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .mod { max-width: 52rem; margin: 0 auto; padding: 3rem clamp(1rem, 4vw, 2rem) 5rem; }
  .mod h1 { font-weight: 400; font-size: 2.4rem; margin: 0 0 .5rem; }
  .mod .lede { color: var(--ink-2); margin: 0 0 2rem; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; padding: 0 0 1rem; border-bottom: 1px solid var(--ink); margin-bottom: 1rem; font-family: var(--sans); }
  .bar .spacer { flex: 1; }
  .m-item { border-bottom: 1px solid var(--rule); padding: 1.1rem 0; }
  .m-item.pending { border-left: 3px solid var(--accent); padding-left: 1rem; }
  .m-meta { font-family: var(--sans); font-size: .8125rem; color: var(--ink-2); display: flex; gap: .75rem; flex-wrap: wrap; }
  .m-meta strong { color: var(--ink); }
  .m-body { white-space: pre-wrap; margin: .5rem 0 .75rem; font-size: 1.05rem; line-height: 1.55; overflow-wrap: anywhere; }
  .m-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
  .btn.small { padding: .5rem .85rem; font-size: .8125rem; }
  .btn.danger { background: none; color: var(--danger); border-color: var(--rule); }
  .btn.danger:hover { border-color: var(--danger); background: none; }
  .tag { font-family: var(--sans); font-size: .75rem; border: 1px solid currentColor; border-radius: 999px; padding: .05rem .5rem; }
  .tag.pending { color: var(--accent); }
  .login { display: grid; gap: .9rem; max-width: 22rem; font-family: var(--sans); }
  .login label { display: grid; gap: .35rem; font-size: .8125rem; font-weight: 600; }
  .login input, .reply-box textarea { font: 400 1rem/1.5 var(--serif); color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 6px; padding: .6rem .75rem; width: 100%; }
  .reply-box { display: grid; gap: .6rem; margin-top: .75rem; }
  .reply-box textarea { min-height: 6rem; }
  .msg { font-family: var(--sans); font-size: .875rem; color: var(--ink-2); }
  .msg.error { color: var(--danger); }
  select { font: 500 .8125rem var(--sans); color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 999px; padding: .45rem .8rem; }
</style>
</head>
<body>
<main class="mod">
  <h1>Discussions</h1>
  <p class="lede">Read, approve, hide or delete readers' comments, and reply as the author.</p>

  <form class="login" id="login" hidden>
    <label>Moderator password
      <input type="password" id="pw" autocomplete="current-password" required>
    </label>
    <div><button class="btn" type="submit">Open discussions</button></div>
    <p class="msg" id="login-msg" role="status"></p>
  </form>

  <section id="panel" hidden>
    <div class="bar">
      <select id="filter" aria-label="Show">
        <option value="all">All comments</option>
        <option value="pending">Waiting for review</option>
        <option value="published">Published</option>
      </select>
      <select id="piece" aria-label="Piece"><option value="">All pieces</option></select>
      <span class="spacer"></span>
      <button class="btn quiet small" type="button" id="refresh">Refresh</button>
      <button class="btn quiet small" type="button" id="logout">Sign out</button>
    </div>
    <p class="msg" id="panel-msg" role="status"></p>
    <div id="list"></div>
  </section>
</main>
<script>
(function () {
  'use strict';
  var KEY = 'pl-mod-pw';
  var pw = '';
  try { pw = sessionStorage.getItem(KEY) || ''; } catch (e) {}
  var site = { works: {}, author: {} };
  var all = [];
  var $ = function (id) { return document.getElementById(id); };

  function api(method, body) {
    return fetch('/api/moderate', {
      method: method,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + pw },
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) { var e = new Error(d.error || ('Error ' + r.status)); e.status = r.status; throw e; }
        return d;
      });
    });
  }

  function showLogin(message) {
    $('panel').hidden = true;
    $('login').hidden = false;
    $('login-msg').textContent = message || '';
    $('login-msg').className = 'msg' + (message ? ' error' : '');
    $('pw').focus();
  }

  function title(slug) {
    var w = site.works && site.works[slug];
    return w ? (w.ka || w.en || slug) : slug + ' (removed piece)';
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function render() {
    var f = $('filter').value, p = $('piece').value;
    var list = $('list');
    list.innerHTML = '';
    var shown = all.filter(function (c) { return (f === 'all' || c.status === f) && (!p || c.slug === p); });
    if (!shown.length) { list.appendChild(el('p', 'msg', 'No comments here yet.')); return; }
    shown.forEach(function (c) {
      var item = el('article', 'm-item' + (c.status === 'pending' ? ' pending' : ''));
      var meta = el('div', 'm-meta');
      meta.appendChild(el('strong', null, c.name + (c.is_author ? ' (you)' : '')));
      meta.appendChild(el('span', null, new Date(c.created_at).toLocaleString()));
      var link = el('a', null, title(c.slug));
      link.href = '/' + (c.lang === 'en' ? 'en' : 'ka') + '/' + c.slug + '/#discussion';
      link.target = '_blank';
      meta.appendChild(link);
      if (c.parent_id) meta.appendChild(el('span', null, 'reply'));
      if (c.status === 'pending') meta.appendChild(el('span', 'tag pending', 'waiting for review'));
      item.appendChild(meta);
      item.appendChild(el('p', 'm-body', c.body));
      var actions = el('div', 'm-actions');
      function button(label, cls, fn) { var b = el('button', 'btn small ' + cls, label); b.type = 'button'; b.addEventListener('click', fn); actions.appendChild(b); return b; }
      if (c.status === 'pending') button('Approve', '', function () { act({ action: 'approve', id: c.id }); });
      else button('Hide', 'quiet', function () { act({ action: 'hide', id: c.id }); });
      button('Reply as author', 'quiet', function () { openReply(item, c); });
      button('Delete', 'danger', function () {
        if (confirm('Delete this comment' + (c.parent_id ? '' : ' and its replies') + '? This cannot be undone.')) act({ action: 'delete', id: c.id });
      });
      item.appendChild(actions);
      list.appendChild(item);
    });
  }

  function openReply(item, c) {
    var old = document.querySelector('.reply-box');
    if (old) old.remove();
    var box = el('form', 'reply-box');
    var ta = el('textarea');
    ta.setAttribute('aria-label', 'Your reply');
    var row = el('div', 'm-actions');
    var send = el('button', 'btn small', 'Post reply'); send.type = 'submit';
    var cancel = el('button', 'btn quiet small', 'Cancel'); cancel.type = 'button';
    cancel.addEventListener('click', function () { box.remove(); });
    row.appendChild(send); row.appendChild(cancel);
    box.appendChild(ta); box.appendChild(row);
    box.addEventListener('submit', function (e) {
      e.preventDefault();
      var lang = c.lang === 'en' ? 'en' : 'ka';
      var name = (site.author && site.author[lang]) || 'Author';
      act({ action: 'reply', id: c.id, slug: c.slug, body: ta.value, name: name, lang: lang });
    });
    item.appendChild(box);
    ta.focus();
  }

  function act(body) {
    $('panel-msg').textContent = 'Saving…';
    $('panel-msg').className = 'msg';
    api('POST', body).then(load).catch(function (e) {
      $('panel-msg').textContent = e.message;
      $('panel-msg').className = 'msg error';
    });
  }

  function load() {
    return api('GET').then(function (d) {
      all = d.comments || [];
      $('login').hidden = true;
      $('panel').hidden = false;
      var pending = all.filter(function (c) { return c.status === 'pending'; }).length;
      $('panel-msg').textContent = all.length + ' comments' + (pending ? ', ' + pending + ' waiting for review' : '') + '.';
      $('panel-msg').className = 'msg';
      var sel = $('piece'), keep = sel.value;
      var slugs = {};
      all.forEach(function (c) { slugs[c.slug] = true; });
      sel.innerHTML = '<option value="">All pieces</option>';
      Object.keys(slugs).forEach(function (s) { var o = el('option', null, title(s)); o.value = s; sel.appendChild(o); });
      sel.value = keep;
      render();
    }).catch(function (e) {
      if (e.status === 401) { try { sessionStorage.removeItem(KEY); } catch (x) {} showLogin(pw ? 'That password is not right.' : ''); }
      else showLogin(e.message);
    });
  }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    pw = $('pw').value;
    try { sessionStorage.setItem(KEY, pw); } catch (x) {}
    load();
  });
  $('logout').addEventListener('click', function () { pw = ''; try { sessionStorage.removeItem(KEY); } catch (x) {} showLogin(''); });
  $('refresh').addEventListener('click', load);
  $('filter').addEventListener('change', render);
  $('piece').addEventListener('change', render);

  fetch('/data/site.json').then(function (r) { return r.json(); }).then(function (d) { site = d; }).catch(function () {}).then(function () {
    if (pw) load(); else showLogin('');
  });
})();
</script>
</body>
</html>
